# Production stack: PostgreSQL · API · storefront · console · partner app · Caddy (HTTPS) · backups
# 1) cp .env.production.example .env  2) fill in secrets & domains  3) docker compose up -d --build
name: naamdev

x-next-build-args: &next-args
  API_INTERNAL_URL: http://api:4000
  NEXT_PUBLIC_SITE_URL: https://${WEB_DOMAIN}
  NEXT_PUBLIC_SOCKET_URL: https://${API_DOMAIN}
  NEXT_PUBLIC_STOREFRONT_URL: https://${WEB_DOMAIN}
  NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
  NEXT_PUBLIC_SUPPORT_PHONE: ${NEXT_PUBLIC_SUPPORT_PHONE:-}
  NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
  NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: naamdev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: naamdev
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naamdev -d naamdev"]
      interval: 10s
      retries: 10

  api:
    build: { context: ., dockerfile: infra/docker/api.Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://naamdev:${POSTGRES_PASSWORD}@postgres:5432/naamdev?schema=public
      API_PUBLIC_URL: https://${API_DOMAIN}
      APP_URL_WEB: https://${WEB_DOMAIN}
      APP_URL_ADMIN: https://${ADMIN_DOMAIN}
      APP_URL_DELIVERY: https://${PARTNER_DOMAIN}
      COOKIE_SECURE: "true"
      # Caddy → Next.js rewrite → API
      TRUST_PROXY: "2"
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on: { postgres: { condition: service_healthy } }

  web:
    build: { context: ., dockerfile: infra/docker/next.Dockerfile, args: { APP: web, <<: *next-args } }
    restart: unless-stopped
    depends_on: [api]

  admin:
    build: { context: ., dockerfile: infra/docker/next.Dockerfile, args: { APP: admin, <<: *next-args } }
    restart: unless-stopped
    depends_on: [api]

  delivery:
    build: { context: ., dockerfile: infra/docker/next.Dockerfile, args: { APP: delivery, <<: *next-args } }
    restart: unless-stopped
    depends_on: [api]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      WEB_DOMAIN: ${WEB_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      PARTNER_DOMAIN: ${PARTNER_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, admin, delivery, api]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://naamdev:${POSTGRES_PASSWORD}@postgres:5432/naamdev
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./infra/backup/backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on: { postgres: { condition: service_healthy } }

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
