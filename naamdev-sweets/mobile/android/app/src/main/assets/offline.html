<title>Offline</title><style>
:root{--bg:#fffbf3;--card:#fff;--ink:#2a1215;--muted:#7a5a5e;--line:#efdccd;--brand:#8f1d34;--brand-ink:#fff;--err:#b22a42;--ring:#f57f0e}
@media (prefers-color-scheme:dark){:root{--bg:#120a0b;--card:#1d1113;--ink:#fbefe4;--muted:#c4a8a2;--line:#3a2326;--brand:#f59e1b;--brand-ink:#2a1215;--err:#ff8a9a}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:100%;max-width:420px;text-align:center}
.emblem{width:96px;height:96px;margin:0 auto 12px;display:block}
h1{font-family:Georgia,"Times New Roman",serif;font-size:26px;line-height:1.2;margin:8px 0}
p{color:var(--muted);margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:20px;text-align:left}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;outline:none}
input:focus{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 25%,transparent)}
button{width:100%;font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px;margin-top:14px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
button[disabled]{opacity:.6}
button.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.err{color:var(--err);font-size:14px;font-weight:600;min-height:21px;margin:10px 0 0}
.hint{font-size:13px}
small{display:block;color:var(--muted);margin-top:18px;font-size:12px}
</style></head>

<h1>Can't reach the store</h1>
<p>Check your internet connection. We'll try again as soon as you're back online.</p>
<button id="retry" type="button">Try again</button>
<button id="change" class="ghost" type="button" hidden>Change store address</button>
</main>
<script>
(function(){
  var bridge = window.NaamdevAndroid, info = {};
  try { info = JSON.parse(bridge.info()); } catch (e) {}
  if (info.app === "partner") document.querySelector("h1").textContent = "Can't reach the partner site";
  var retry = function () { bridge.retry(); };
  document.getElementById("retry").addEventListener("click", retry);
  window.addEventListener("online", retry);
  if (!info.locked) {
    var c = document.getElementById("change");
    c.hidden = false;
    c.addEventListener("click", function () { bridge.changeServer(); });
  }
})();
</script></body></html>
