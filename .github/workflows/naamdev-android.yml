name: NAAMDEV Android apps

# Builds the customer app (NAAMDEV SWEETS), the delivery partner app (NAAMDEV Partner) and the staff
# console app (NAAMDEV Admin) as APKs
# and publishes them as a GitHub release with direct download links (also kept as run artifacts).
on:
  push:
    paths:
      - "naamdev-sweets/mobile/android/**"
      - ".github/workflows/naamdev-android.yml"
  workflow_dispatch:
    inputs:
      customer_url:
        description: "Storefront address for the customer app (empty = https://naamdevseets.web.app)"
        required: false
        default: ""
      partner_url:
        description: "Partner site address for the partner app (empty = https://naamdevseets-partner.web.app)"
        required: false
        default: ""
      admin_url:
        description: "Staff console address for the admin app (empty = https://naamdevseets-admin.web.app)"
        required: false
        default: ""
      publish:
        description: "Publish the APKs as a GitHub release (direct download links)"
        type: boolean
        default: true

permissions:
  contents: write # create the release that holds the APKs

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: naamdev-sweets/mobile/android
    env:
      # The Firebase Hosting addresses are built in, so the apps open the shop straight away.
      # Override them with repository variables (Settings → Secrets and variables → Actions → Variables).
      NAAMDEV_CUSTOMER_URL: ${{ inputs.customer_url || vars.NAAMDEV_CUSTOMER_URL || 'https://naamdevseets.web.app' }}
      NAAMDEV_PARTNER_URL: ${{ inputs.partner_url || vars.NAAMDEV_PARTNER_URL || 'https://naamdevseets-partner.web.app' }}
      NAAMDEV_ADMIN_URL: ${{ inputs.admin_url || vars.NAAMDEV_ADMIN_URL || 'https://naamdevseets-admin.web.app' }}
      NAAMDEV_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAAMDEV_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NAAMDEV_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NAAMDEV_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NAAMDEV_ANDROID_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/naamdev-signing.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            {
              echo "NAAMDEV_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "NAAMDEV_KEY_ALIAS=$KEY_ALIAS"
              echo "NAAMDEV_KEY_PASSWORD=$KEY_PASSWORD"
              echo "SIGNING=release key"
            } >> "$GITHUB_ENV"
          else
            # No release key configured: sign with a throw-away key made for this build only.
            PASS="$(openssl rand -hex 16)"
            echo "::add-mask::$PASS"
            keytool -genkeypair -keystore "$KS" -storepass "$PASS" -keypass "$PASS" -alias naamdev-test \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=NAAMDEV SWEETS test build" -noprompt
            {
              echo "NAAMDEV_KEYSTORE_PASSWORD=$PASS"
              echo "NAAMDEV_KEY_ALIAS=naamdev-test"
              echo "NAAMDEV_KEY_PASSWORD=$PASS"
              echo "SIGNING=temporary test key (uninstall the previous test build before installing this one)"
            } >> "$GITHUB_ENV"
          fi
          echo "NAAMDEV_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build APKs
        run: ./gradlew --no-daemon --stacktrace assembleCustomerRelease assemblePartnerRelease assembleAdminRelease

      - name: Collect APKs
        run: |
          OUT="$RUNNER_TEMP/apk"
          V="1.0.${{ github.run_number }}"
          mkdir -p "$OUT"
          cp app/build/outputs/apk/customer/release/app-customer-release.apk "$OUT/naamdev-sweets-$V.apk"
          cp app/build/outputs/apk/partner/release/app-partner-release.apk "$OUT/naamdev-partner-$V.apk"
          cp app/build/outputs/apk/admin/release/app-admin-release.apk "$OUT/naamdev-admin-$V.apk"
          (cd "$OUT" && sha256sum *.apk > SHA256SUMS.txt)
          {
            echo "### NAAMDEV Android apps $V"
            echo ""
            echo "| App | File |"
            echo "|---|---|"
            echo "| Customer (NAAMDEV SWEETS) | naamdev-sweets-$V.apk |"
            echo "| Delivery partner (NAAMDEV Partner) | naamdev-partner-$V.apk |"
            echo "| Staff console (NAAMDEV Admin) | naamdev-admin-$V.apk |"
            echo ""
            echo "- Storefront address: ${NAAMDEV_CUSTOMER_URL:-asked on first launch}"
            echo "- Partner site address: ${NAAMDEV_PARTNER_URL:-asked on first launch}"
            echo "- Staff console address: ${NAAMDEV_ADMIN_URL:-asked on first launch}"
            echo "- Signed with: $SIGNING"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: naamdev-android-apks-1.0.${{ github.run_number }}
          path: ${{ runner.temp }}/apk/
          if-no-files-found: error
          retention-days: 30

      - name: Publish release (direct download links)
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          V="1.0.${{ github.run_number }}"
          TAG="naamdev-android-v$V"
          OUT="$RUNNER_TEMP/apk"
          PRE="--prerelease"; [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ] && PRE="--latest"
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          **NAAMDEV SWEETS** (customers), **NAAMDEV Partner** (delivery riders) and **NAAMDEV Admin** (staff console), version $V, built from \`$GITHUB_REF_NAME\`.

          | App | Opens |
          |---|---|
          | naamdev-sweets-$V.apk | $NAAMDEV_CUSTOMER_URL |
          | naamdev-partner-$V.apk | $NAAMDEV_PARTNER_URL |
          | naamdev-admin-$V.apk | $NAAMDEV_ADMIN_URL |

          Install: tap the APK on your Android phone and allow "Install unknown apps" for your browser or file manager.
          Signed with: $SIGNING
          NOTES
          gh release create "$TAG" "$OUT"/*.apk "$OUT/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "NAAMDEV Android apps $V" --notes-file "$RUNNER_TEMP/notes.md" $PRE
          echo "- Download: ${{ github.server_url }}/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
