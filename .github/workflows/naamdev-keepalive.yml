name: NAAMDEV keep-alive

# Render's free web service falls asleep after 15 minutes without visitors, and the first visit then
# waits about a minute. Pinging it every 10 minutes keeps it awake (one always-on service fits in
# Render's 750 free hours a month) and lets its background jobs keep running.
# GitHub pauses scheduled workflows after 60 days without any repository activity; re-enable it in the
# Actions tab if that happens.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE: ${{ vars.NAAMDEV_RENDER_SERVICE || 'naamdev-api' }}
        run: |
          [ -n "$RENDER_API_KEY" ] || { echo "RENDER_API_KEY isn't set yet — nothing to keep awake."; exit 0; }
          URL="$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" \
            "https://api.render.com/v1/services?name=$RENDER_SERVICE&limit=20" | jq -r --arg n "$RENDER_SERVICE" '[.[] | select(.service.name == $n)][0].service.serviceDetails.url // empty')"
          [ -n "$URL" ] || { echo "The API isn't deployed yet."; exit 0; }
          curl -sS --retry 3 --retry-delay 10 --max-time 90 -o /dev/null -w "%{http_code} $URL/healthz\n" "$URL/healthz"
