name: NAAMDEV deploy (free plans)

# Deploys the whole system on free plans only — no billing account, no card:
#   Firebase Spark: Firestore (data + live updates), Authentication (email/password), Hosting (3 static sites)
#   Render free web service: the API (orders, payments, stock, uploads)
# Run it from the Actions tab ("Run workflow"). Setup steps: naamdev-sweets/docs/DEPLOYMENT.md
on:
  workflow_dispatch:
    inputs:
      seed_sample_catalog:
        description: "First deploy only: load the sample sweets catalogue (edit or archive it later in the console)"
        type: boolean
        default: true
      create_demo_logins:
        description: "Create demo logins for testing (owner@, manager@, orders@, packing@, support@, rider@, customer@naamdevsweets.local) with your NAAMDEV_ADMIN_PASSWORD"
        type: boolean
        default: false
      remove_demo_logins:
        description: "Remove the demo logins (do this once you've finished testing)"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # keyless sign-in to Google Cloud (Workload Identity Federation)

concurrency:
  group: naamdev-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'naamdevseets' }}
  # The project number (Firebase "messagingSenderId"), used for keyless sign-in.
  PROJECT_NUMBER: ${{ vars.FIREBASE_PROJECT_NUMBER || '1008791450524' }}
  REGION: asia-south1
  # Hosting sites (addresses <site>.web.app). The project id can't be renamed, but sites can.
  WEB_SITE: ${{ vars.NAAMDEV_WEB_SITE || 'naamdevsweets' }}
  ADMIN_SITE: ${{ vars.NAAMDEV_ADMIN_SITE || 'naamdevsweets-admin' }}
  PARTNER_SITE: ${{ vars.NAAMDEV_PARTNER_SITE || 'naamdevsweets-partner' }}
  # The first, misspelt sites: they now redirect to the addresses above.
  LEGACY_WEB_SITE: naamdevseets
  LEGACY_ADMIN_SITE: naamdevseets-admin
  LEGACY_PARTNER_SITE: naamdevseets-partner
  RENDER_SERVICE: ${{ vars.NAAMDEV_RENDER_SERVICE || 'naamdev-api' }}
  RENDER_REGION: singapore # closest free Render region to India

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: naamdev-sweets
    steps:
      - uses: actions/checkout@v4

      - name: Check the Render API key
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::Add the RENDER_API_KEY secret (Render → Account settings → API keys). See naamdev-sweets/docs/DEPLOYMENT.md."
            exit 1
          fi

      # Sign in to Google Cloud: with a service-account key file (FIREBASE_SERVICE_ACCOUNT) when one is
      # stored, otherwise keyless through Workload Identity Federation (one-time Cloud Shell setup).
      - name: Choose how to sign in to Google Cloud
        id: cred
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if printf %s "$SA" | jq -e '.type == "service_account"' >/dev/null 2>&1; then
            echo "mode=key" >> "$GITHUB_OUTPUT"; echo "Using the service-account key."
          else
            [ -n "$SA" ] && echo "::warning::FIREBASE_SERVICE_ACCOUNT isn't a key file (JSON) — using keyless sign-in instead."
            echo "mode=keyless" >> "$GITHUB_OUTPUT"; echo "Using keyless sign-in (Workload Identity Federation)."
          fi

      - uses: google-github-actions/auth@v2
        if: steps.cred.outputs.mode == 'key'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}

      - uses: google-github-actions/auth@v2
        if: steps.cred.outputs.mode == 'keyless'
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - name: Explain keyless sign-in setup
        if: failure() && steps.cred.outputs.mode == 'keyless'
        run: |
          echo "::error::Keyless sign-in isn't set up yet. Run scripts/setup-keyless-deploy.sh once in Cloud Shell (docs/DEPLOYMENT.md), then run this workflow again."
          exit 1

      - uses: google-github-actions/setup-gcloud@v2

      - uses: pnpm/action-setup@v4
        with: { package_json_file: naamdev-sweets/package.json }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: naamdev-sweets/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Enable the (free) Google APIs Firebase needs
        run: |
          gcloud services enable firestore.googleapis.com identitytoolkit.googleapis.com firebase.googleapis.com \
            firebasehosting.googleapis.com firebaserules.googleapis.com iam.googleapis.com iamcredentials.googleapis.com \
            cloudresourcemanager.googleapis.com serviceusage.googleapis.com --project "$PROJECT_ID"

      - name: Firestore database
        run: |
          if ! gcloud firestore databases describe --database='(default)' --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud firestore databases create --location="$REGION" --type=firestore-native --project "$PROJECT_ID" || {
              echo "::error::Couldn't create the database. In the Firebase console open Firestore Database → Create database (location asia-south1, production mode), then re-run."
              exit 1
            }
          fi

      - name: Email/password sign-in (Firebase Authentication)
        run: |
          TOKEN="$(gcloud auth print-access-token)"
          API="https://identitytoolkit.googleapis.com/admin/v2/projects/$PROJECT_ID/config"
          if curl -sf -X PATCH "$API?updateMask=signIn.email.enabled,signIn.email.passwordRequired" \
               -H "Authorization: Bearer $TOKEN" -H "x-goog-user-project: $PROJECT_ID" -H "Content-Type: application/json" \
               -d '{"signIn":{"email":{"enabled":true,"passwordRequired":true}}}' >/dev/null; then
            echo "Email/password sign-in is enabled."
          else
            echo "::error::Couldn't enable Email/Password sign-in. In the Firebase console open Authentication → Get started → Email/Password → Enable, then re-run."
            exit 1
          fi

      # Seed before (re)starting the API, so a fresh server loads a complete catalogue.
      - name: Seed data (idempotent)
        id: seed
        env:
          SEED_ADMIN_EMAIL: ${{ secrets.NAAMDEV_ADMIN_EMAIL }}
          # Optional: without it the owner sets a password from the reset email sent below.
          SEED_ADMIN_PASSWORD: ${{ secrets.NAAMDEV_ADMIN_PASSWORD }}
          SEED_SAMPLE_CATALOG: ${{ inputs.seed_sample_catalog }}
          # Demo logins on a live shop use the owner's private password, never the public dev one.
          SEED_DEMO_ACCOUNTS: ${{ inputs.create_demo_logins }}
          SEED_DEMO_PASSWORD: ${{ secrets.NAAMDEV_ADMIN_PASSWORD }}
          SEED_REMOVE_DEMO_ACCOUNTS: ${{ inputs.remove_demo_logins }}
        run: |
          if [ -z "$SEED_ADMIN_EMAIL" ]; then
            echo "::error::Add the NAAMDEV_ADMIN_EMAIL secret (your email) — it becomes your console login."
            exit 1
          fi
          if [ "$SEED_DEMO_ACCOUNTS" = "true" ] && [ -z "$SEED_DEMO_PASSWORD" ]; then
            echo "::error::Demo logins need the NAAMDEV_ADMIN_PASSWORD secret (they use the same private password)."
            exit 1
          fi
          # GOOGLE_APPLICATION_CREDENTIALS comes from the sign-in step (key file or keyless).
          NODE_ENV=production FIREBASE_PROJECT_ID="$PROJECT_ID" pnpm --filter @naamdev/db seed

      - name: Key for the API server (rotated on every deploy)
        run: |
          SA="naamdev-run@$PROJECT_ID.iam.gserviceaccount.com"
          gcloud iam service-accounts describe "$SA" --project "$PROJECT_ID" >/dev/null 2>&1 || \
            gcloud iam service-accounts create naamdev-run --display-name="NAAMDEV API server" --project "$PROJECT_ID"
          for role in roles/datastore.user roles/firebaseauth.admin; do
            gcloud projects add-iam-policy-binding "$PROJECT_ID" --member="serviceAccount:$SA" --role="$role" --condition=None --quiet >/dev/null
          done
          gcloud iam service-accounts keys create "$RUNNER_TEMP/run-key.json" --iam-account="$SA" --project "$PROJECT_ID" --quiet
          NEW_KEY="$(jq -r .private_key_id "$RUNNER_TEMP/run-key.json")"
          # Keep only the newest key (old ones stop working once the server restarts with the new one).
          for k in $(gcloud iam service-accounts keys list --iam-account="$SA" --managed-by=user --format='value(name.basename())' --project "$PROJECT_ID"); do
            [ "$k" != "$NEW_KEY" ] && gcloud iam service-accounts keys delete "$k" --iam-account="$SA" --project "$PROJECT_ID" --quiet || true
          done
          B64="$(base64 -w0 "$RUNNER_TEMP/run-key.json")"
          rm -f "$RUNNER_TEMP/run-key.json"
          echo "::add-mask::$B64"
          echo "SA_B64=$B64" >> "$GITHUB_ENV"
          echo "WEB_URL=https://$WEB_SITE.web.app" >> "$GITHUB_ENV"
          echo "ADMIN_URL=https://$ADMIN_SITE.web.app" >> "$GITHUB_ENV"
          echo "PARTNER_URL=https://$PARTNER_SITE.web.app" >> "$GITHUB_ENV"

      - name: Deploy the API on Render (free web service)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || 'NAAMDEV SWEETS <no-reply@naamdevsweets.com>' }}
        run: |
          R="${RENDER_API_BASE:-https://api.render.com/v1}"
          rapi() { curl -sS --fail-with-body -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" -H "Content-Type: application/json" "$@"; }
          OWNER="$(rapi "$R/owners?limit=20" | jq -r '.[0].owner.id')"
          [ -n "$OWNER" ] && [ "$OWNER" != "null" ] || { echo "::error::The Render API key didn't return a workspace."; exit 1; }
          SERVICE="$(rapi "$R/services?name=$RENDER_SERVICE&ownerId=$OWNER&limit=20" | jq -r --arg n "$RENDER_SERVICE" '[.[] | select(.service.name == $n)][0].service.id // empty')"

          # Secrets that must stay the same across deploys are kept from the service's current settings.
          CURRENT='[]'
          if [ -n "$SERVICE" ]; then CURRENT="$(rapi "$R/services/$SERVICE/env-vars?limit=100" | jq '[.[] | .envVar]')"; fi
          keep() { printf %s "$CURRENT" | jq -r --arg k "$1" '[.[] | select(.key == $k)][0].value // empty'; }
          ENCRYPTION_KEY="$(keep ENCRYPTION_KEY)"; [ -n "$ENCRYPTION_KEY" ] || ENCRYPTION_KEY="$(openssl rand -hex 32)"
          JOBS_SECRET="$(keep JOBS_SECRET)"; [ -n "$JOBS_SECRET" ] || JOBS_SECRET="$(openssl rand -hex 24)"
          echo "::add-mask::$ENCRYPTION_KEY"; echo "::add-mask::$JOBS_SECRET"
          EMAIL_PROVIDER=none; [ -n "$SMTP_HOST" ] && EMAIL_PROVIDER=smtp

          ENV_JSON="$(jq -n \
            --arg project "$PROJECT_ID" --arg sa "$SA_B64" --arg enc "$ENCRYPTION_KEY" --arg jobs "$JOBS_SECRET" \
            --arg web "$WEB_URL" --arg admin "$ADMIN_URL" --arg partner "$PARTNER_URL" --arg email "$EMAIL_PROVIDER" \
            --arg rzpId "$RAZORPAY_KEY_ID" --arg rzpSecret "$RAZORPAY_KEY_SECRET" --arg rzpHook "$RAZORPAY_WEBHOOK_SECRET" \
            --arg smtpHost "$SMTP_HOST" --arg smtpPort "$SMTP_PORT" --arg smtpUser "$SMTP_USER" --arg smtpPass "$SMTP_PASS" --arg from "$EMAIL_FROM" '
            [ {key:"NODE_ENV",value:"production"}, {key:"LOG_LEVEL",value:"info"}, {key:"FIREBASE_PROJECT_ID",value:$project},
              {key:"FIREBASE_SERVICE_ACCOUNT_BASE64",value:$sa}, {key:"ENCRYPTION_KEY",value:$enc}, {key:"JOBS_SECRET",value:$jobs},
              {key:"APP_URL_WEB",value:$web}, {key:"APP_URL_ADMIN",value:$admin}, {key:"APP_URL_DELIVERY",value:$partner},
              {key:"TRUST_PROXY",value:"1"}, {key:"STORAGE_DRIVER",value:"firestore"}, {key:"SMS_PROVIDER",value:"none"},
              {key:"EMAIL_PROVIDER",value:$email}, {key:"EMAIL_FROM",value:$from},
              {key:"JOBS_ENABLED",value:"true"}, {key:"JOBS_LEASES",value:"false"}, {key:"JOBS_OFFER_EVERY_MS",value:"60000"},
              {key:"CATALOG_CHECK_MS",value:"600000"}, {key:"CATALOG_MAX_AGE_MS",value:"21600000"} ]
            + (if $rzpId != "" and $rzpSecret != "" then [{key:"RAZORPAY_KEY_ID",value:$rzpId},{key:"RAZORPAY_KEY_SECRET",value:$rzpSecret}] else [] end)
            + (if $rzpHook != "" then [{key:"RAZORPAY_WEBHOOK_SECRET",value:$rzpHook}] else [] end)
            + (if $smtpHost != "" then [{key:"SMTP_HOST",value:$smtpHost},{key:"SMTP_PORT",value:$smtpPort},{key:"SMTP_USER",value:$smtpUser},{key:"SMTP_PASS",value:$smtpPass}] else [] end)')"

          if [ -z "$SERVICE" ]; then
            BODY="$(jq -n --arg name "$RENDER_SERVICE" --arg owner "$OWNER" --arg repo "https://github.com/${{ github.repository }}" \
              --arg branch "${{ github.ref_name }}" --arg region "$RENDER_REGION" --argjson env "$ENV_JSON" '
              { type:"web_service", name:$name, ownerId:$owner, repo:$repo, branch:$branch, autoDeployTrigger:"off", envVars:$env,
                serviceDetails:{ runtime:"docker", plan:"free", region:$region, healthCheckPath:"/healthz", numInstances:1,
                  envSpecificDetails:{ dockerfilePath:"./naamdev-sweets/infra/docker/api.Dockerfile", dockerContext:"./naamdev-sweets" } } }')"
            CREATED="$(rapi -X POST "$R/services" -d "$BODY")"
            SERVICE="$(printf %s "$CREATED" | jq -r '.service.id // .id')"
            DEPLOY="$(printf %s "$CREATED" | jq -r '.deployId // empty')"
            echo "Created Render service $SERVICE."
          else
            rapi -X PATCH "$R/services/$SERVICE" -d "$(jq -n --arg b "${{ github.ref_name }}" '{branch:$b}')" >/dev/null
            rapi -X PUT "$R/services/$SERVICE/env-vars" -d "$ENV_JSON" >/dev/null
          fi
          # A new service starts its first deploy by itself; otherwise start one now.
          [ -n "${DEPLOY:-}" ] || DEPLOY="$(rapi -X POST "$R/services/$SERVICE/deploys" -d '{"clearCache":"do_not_clear"}' | jq -r '.id')"
          echo "Waiting for Render deploy $DEPLOY (the free plan builds slowly — up to ~15 minutes)…"
          for i in $(seq 1 120); do
            STATUS="$(rapi "$R/services/$SERVICE/deploys/$DEPLOY" | jq -r '.status')"
            case "$STATUS" in
              live) break ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "::error::Render deploy ended with status $STATUS — open the service's Events/Logs in the Render dashboard."; exit 1 ;;
            esac
            sleep 15
          done
          [ "$STATUS" = live ] || { echo "::error::Render deploy didn't finish in time (status $STATUS)."; exit 1; }
          API_URL="$(rapi "$R/services/$SERVICE" | jq -r '.serviceDetails.url')"
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          for i in $(seq 1 12); do curl -sf "$API_URL/health" && break; sleep 10; done
          echo

      - name: Build the three apps (static files)
        env:
          MAPS_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          VAPID_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
        run: |
          export NEXT_PUBLIC_API_URL="$API_URL" NEXT_PUBLIC_STOREFRONT_URL="$WEB_URL" NEXT_PUBLIC_FIREBASE_PROJECT_ID="$PROJECT_ID" \
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$MAPS_KEY" NEXT_PUBLIC_FIREBASE_VAPID_KEY="$VAPID_KEY"
          NEXT_PUBLIC_SITE_URL="$WEB_URL" pnpm --filter @naamdev/web build
          NEXT_PUBLIC_SITE_URL="$ADMIN_URL" pnpm --filter @naamdev/admin build
          NEXT_PUBLIC_SITE_URL="$PARTNER_URL" pnpm --filter @naamdev/delivery build

      - name: Firebase Hosting, Firestore rules & indexes
        run: |
          site_exists() { npx firebase hosting:sites:get "$1" --project "$PROJECT_ID" >/dev/null 2>&1; }
          for site in "$WEB_SITE" "$ADMIN_SITE" "$PARTNER_SITE"; do
            site_exists "$site" || npx firebase hosting:sites:create "$site" --project "$PROJECT_ID" --non-interactive || {
              echo "::error::Couldn't create the Hosting site \"$site\" — the name may already belong to another Firebase project. Pick another name with the repository variables NAAMDEV_WEB_SITE / NAAMDEV_ADMIN_SITE / NAAMDEV_PARTNER_SITE and re-run."
              exit 1
            }
          done
          # Old sites that still exist become permanent redirects to the new addresses.
          old_site() { [ -n "$1" ] && [ "$1" != "$2" ] && site_exists "$1" && echo "$1" || echo ""; }
          export NAAMDEV_WEB_SITE="$WEB_SITE" NAAMDEV_ADMIN_SITE="$ADMIN_SITE" NAAMDEV_PARTNER_SITE="$PARTNER_SITE"
          export NAAMDEV_LEGACY_WEB_SITE="$(old_site "$LEGACY_WEB_SITE" "$WEB_SITE")"
          export NAAMDEV_LEGACY_ADMIN_SITE="$(old_site "$LEGACY_ADMIN_SITE" "$ADMIN_SITE")"
          export NAAMDEV_LEGACY_PARTNER_SITE="$(old_site "$LEGACY_PARTNER_SITE" "$PARTNER_SITE")"
          node scripts/hosting-config.mjs
          for t in web admin partner legacy-web legacy-admin legacy-partner; do npx firebase target:clear hosting "$t" --project "$PROJECT_ID" >/dev/null 2>&1 || true; done
          npx firebase target:apply hosting web "$WEB_SITE" --project "$PROJECT_ID"
          npx firebase target:apply hosting admin "$ADMIN_SITE" --project "$PROJECT_ID"
          npx firebase target:apply hosting partner "$PARTNER_SITE" --project "$PROJECT_ID"
          [ -z "$NAAMDEV_LEGACY_WEB_SITE" ] || npx firebase target:apply hosting legacy-web "$NAAMDEV_LEGACY_WEB_SITE" --project "$PROJECT_ID"
          [ -z "$NAAMDEV_LEGACY_ADMIN_SITE" ] || npx firebase target:apply hosting legacy-admin "$NAAMDEV_LEGACY_ADMIN_SITE" --project "$PROJECT_ID"
          [ -z "$NAAMDEV_LEGACY_PARTNER_SITE" ] || npx firebase target:apply hosting legacy-partner "$NAAMDEV_LEGACY_PARTNER_SITE" --project "$PROJECT_ID"
          npx firebase deploy --only hosting,firestore:rules,firestore:indexes --project "$PROJECT_ID" --non-interactive --force
          echo "LEGACY_URLS=$(for s in "$NAAMDEV_LEGACY_WEB_SITE" "$NAAMDEV_LEGACY_ADMIN_SITE" "$NAAMDEV_LEGACY_PARTNER_SITE"; do [ -n "$s" ] && printf 'https://%s.web.app ' "$s"; done)" >> "$GITHUB_ENV"

      - name: Email the owner a link to set the console password
        if: steps.seed.outputs.admin_created == 'true'
        env:
          ADMIN_EMAIL: ${{ secrets.NAAMDEV_ADMIN_EMAIL }}
          WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY || 'AIzaSyBX1iMZlblRmkRgZIc_C7TQrDPtarYLCtw' }}
        run: |
          BODY="$(jq -cn --arg email "$ADMIN_EMAIL" '{requestType:"PASSWORD_RESET",email:$email}')"
          if curl -sf -X POST "https://identitytoolkit.googleapis.com/v1/accounts:sendOobCode?key=$WEB_API_KEY" \
               -H "Content-Type: application/json" -d "$BODY" >/dev/null; then
            echo "SET_PASSWORD_NOTE=Check your email for the link to set your console password." >> "$GITHUB_ENV"
          else
            echo "SET_PASSWORD_NOTE=Open the console, type your email and click Forgot password? to set your password." >> "$GITHUB_ENV"
          fi

      - name: Smoke test
        run: |
          for url in "$WEB_URL" "$WEB_URL/product/kaju-katli" "$ADMIN_URL/login" "$PARTNER_URL/login" "$API_URL/api/v1/public/settings"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$url")"
            echo "$code $url"
            [ "$code" -lt 400 ] || { echo "::error::$url returned $code"; exit 1; }
          done
          for old in $LEGACY_URLS; do
            got="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 30 "$old/login")"
            echo "$got  ← $old/login"
            case "$got" in 301\ https://*/login) ;; *) echo "::error::$old should redirect to the same page on the new address (got: $got)"; exit 1 ;; esac
          done
          {
            echo "### NAAMDEV SWEETS is live (free plans)"
            echo ""
            echo "| | Address |"
            echo "|---|---|"
            echo "| Storefront (customer app) | $WEB_URL |"
            echo "| Staff console | $ADMIN_URL |"
            echo "| Delivery partner app | $PARTNER_URL |"
            echo "| API server (Render) | $API_URL |"
            echo ""
            echo "Sign in to the console with your NAAMDEV_ADMIN_EMAIL. ${SET_PASSWORD_NOTE:-}"
            echo ""
            echo "The *NAAMDEV keep-alive* workflow pings the API every 10 minutes so the free server doesn't fall asleep."
          } >> "$GITHUB_STEP_SUMMARY"
