name: Pay & Download deploy (Render free + Firestore)

# Puts pay-and-download/ live on free plans, next to the NAAMDEV shop and with the same accounts:
#   Render free web service: the app (Docker)
#   Cloud Firestore (Firebase project): payments, settings and files, so nothing is lost when the
#   free server restarts. It uses its own collections (payDownload_*) and its own service account.
# The admin password and the file buyers download are never in this public repository: they arrive
# encrypted in pay-and-download/deploy/setup.enc (see pay-and-download/scripts/deploy-setup.js).
on:
  push:
    branches: [ccr-f1ed0441-u9o5az]
    paths:
      - "pay-and-download/**"
      - ".github/workflows/pay-and-download-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # keyless sign-in to Google Cloud (Workload Identity Federation)

concurrency:
  group: pay-and-download-deploy
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'naamdevseets' }}
  PROJECT_NUMBER: ${{ vars.FIREBASE_PROJECT_NUMBER || '1008791450524' }}
  RENDER_SERVICE: ${{ vars.PAY_DOWNLOAD_RENDER_SERVICE || 'pay-and-download' }}
  RENDER_REGION: singapore # closest free Render region to India
  RUN_SA_NAME: paydl-run

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pay-and-download
    steps:
      - uses: actions/checkout@v4

      - name: Check the Render API key
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::The RENDER_API_KEY secret is missing (Render → Account settings → API keys)."
            exit 1
          fi

      - name: Choose how to sign in to Google Cloud
        id: cred
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if printf %s "$SA" | jq -e '.type == "service_account"' >/dev/null 2>&1; then
            echo "mode=key" >> "$GITHUB_OUTPUT"; echo "Using the service-account key."
          else
            echo "mode=keyless" >> "$GITHUB_OUTPUT"; echo "Using keyless sign-in (Workload Identity Federation)."
          fi

      - uses: google-github-actions/auth@v2
        if: steps.cred.outputs.mode == 'key'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}

      - uses: google-github-actions/auth@v2
        if: steps.cred.outputs.mode == 'keyless'
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@${{ env.PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pay-and-download/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Firestore database
        run: |
          gcloud services enable firestore.googleapis.com iam.googleapis.com --project "$PROJECT_ID"
          gcloud firestore databases describe --database='(default)' --project "$PROJECT_ID" >/dev/null || {
            echo "::error::The project has no Firestore database yet (the NAAMDEV deploy creates it)."
            exit 1
          }

      - name: Deploy key and private setup (admin login, file)
        env:
          FIREBASE_PROJECT_ID: ${{ env.PROJECT_ID }}
        run: node scripts/deploy-setup.js prepare

      # Its own service account and key, so the shop's keys are never touched.
      - name: Key for the app server
        run: |
          SA="$RUN_SA_NAME@$PROJECT_ID.iam.gserviceaccount.com"
          gcloud iam service-accounts describe "$SA" --project "$PROJECT_ID" >/dev/null 2>&1 || \
            gcloud iam service-accounts create "$RUN_SA_NAME" --display-name="Pay & Download server" --project "$PROJECT_ID"
          gcloud projects add-iam-policy-binding "$PROJECT_ID" --member="serviceAccount:$SA" --role=roles/datastore.user --condition=None --quiet >/dev/null
          gcloud iam service-accounts keys create "$RUNNER_TEMP/run-key.json" --iam-account="$SA" --project "$PROJECT_ID" --quiet
          echo "NEW_KEY=$(jq -r .private_key_id "$RUNNER_TEMP/run-key.json")" >> "$GITHUB_ENV"
          B64="$(base64 -w0 "$RUNNER_TEMP/run-key.json")"
          rm -f "$RUNNER_TEMP/run-key.json"
          echo "::add-mask::$B64"
          echo "SA_B64=$B64" >> "$GITHUB_ENV"

      - name: Deploy on Render (free web service)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          R="https://api.render.com/v1"
          rapi() { curl -sS --fail-with-body -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" -H "Content-Type: application/json" "$@"; }
          OWNER="$(rapi "$R/owners?limit=20" | jq -r '.[0].owner.id')"
          [ -n "$OWNER" ] && [ "$OWNER" != "null" ] || { echo "::error::The Render API key didn't return a workspace."; exit 1; }
          SERVICE="$(rapi "$R/services?name=$RENDER_SERVICE&ownerId=$OWNER&limit=20" | jq -r --arg n "$RENDER_SERVICE" '[.[] | select(.service.name == $n)][0].service.id // empty')"

          ENV_JSON="$(jq -n --arg project "$PROJECT_ID" --arg sa "$SA_B64" '
            [ {key:"NODE_ENV",value:"production"}, {key:"TRUST_PROXY",value:"1"}, {key:"MAX_FILE_MB",value:"25"},
              {key:"FIREBASE_PROJECT_ID",value:$project}, {key:"FIREBASE_SERVICE_ACCOUNT_BASE64",value:$sa} ]')"

          if [ -z "$SERVICE" ]; then
            BODY="$(jq -n --arg name "$RENDER_SERVICE" --arg owner "$OWNER" --arg repo "https://github.com/${{ github.repository }}" \
              --arg branch "${{ github.ref_name }}" --arg region "$RENDER_REGION" --argjson env "$ENV_JSON" '
              { type:"web_service", name:$name, ownerId:$owner, repo:$repo, branch:$branch, autoDeployTrigger:"off", envVars:$env,
                serviceDetails:{ runtime:"docker", plan:"free", region:$region, healthCheckPath:"/healthz", numInstances:1,
                  envSpecificDetails:{ dockerfilePath:"./pay-and-download/Dockerfile", dockerContext:"./pay-and-download" } } }')"
            CREATED="$(rapi -X POST "$R/services" -d "$BODY")"
            SERVICE="$(printf %s "$CREATED" | jq -r '.service.id // .id')"
            DEPLOY="$(printf %s "$CREATED" | jq -r '.deployId // empty')"
            echo "Created Render service $SERVICE."
          else
            rapi -X PATCH "$R/services/$SERVICE" -d "$(jq -n --arg b "${{ github.ref_name }}" '{branch:$b}')" >/dev/null
            rapi -X PUT "$R/services/$SERVICE/env-vars" -d "$ENV_JSON" >/dev/null
          fi
          [ -n "${DEPLOY:-}" ] || DEPLOY="$(rapi -X POST "$R/services/$SERVICE/deploys" -d '{"clearCache":"do_not_clear"}' | jq -r '.id')"
          echo "Waiting for Render deploy $DEPLOY (the free plan builds slowly)…"
          STATUS=""
          for i in $(seq 1 120); do
            STATUS="$(rapi "$R/services/$SERVICE/deploys/$DEPLOY" | jq -r '.status')"
            case "$STATUS" in
              live) break ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "::error::Render deploy ended with status $STATUS — see the service's Events/Logs in Render."; exit 1 ;;
            esac
            sleep 15
          done
          [ "$STATUS" = live ] || { echo "::error::Render deploy didn't finish in time (status $STATUS)."; exit 1; }
          APP_URL="$(rapi "$R/services/$SERVICE" | jq -r '.serviceDetails.url')"
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "Live at $APP_URL"

      - name: Remove the app's older keys
        run: |
          SA="$RUN_SA_NAME@$PROJECT_ID.iam.gserviceaccount.com"
          for k in $(gcloud iam service-accounts keys list --iam-account="$SA" --managed-by=user --format='value(name.basename())' --project "$PROJECT_ID"); do
            [ "$k" != "$NEW_KEY" ] && gcloud iam service-accounts keys delete "$k" --iam-account="$SA" --project "$PROJECT_ID" --quiet || true
          done

      - name: Smoke test (a real purchase and download; the test entry is then deleted)
        env:
          FIREBASE_PROJECT_ID: ${{ env.PROJECT_ID }}
        run: |
          for i in $(seq 1 30); do curl -sf --max-time 30 "$APP_URL/healthz" >/dev/null && break; sleep 10; done
          for path in / /admin /styles.css /api/qr; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$APP_URL$path")"
            echo "$code $path"; [ "$code" = 200 ] || { echo "::error::$path returned $code"; exit 1; }
          done
          CONFIG="$(curl -sf "$APP_URL/api/config")"
          echo "$CONFIG" | jq '{productName, amount, upiId, payeeName, fileName, ready}'

          COOKIE="$(node scripts/deploy-setup.js cookie)"
          echo "::add-mask::$COOKIE"
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "Cookie: admin_session=$COOKIE" "$APP_URL/api/admin/session")"
          [ "$code" = 200 ] || { echo "::error::Admin session check returned $code"; exit 1; }
          echo "Admin login works."

          if [ "$(echo "$CONFIG" | jq -r .ready)" != true ]; then
            echo "READY=false" >> "$GITHUB_ENV"
            echo "::notice::The site is up; it shows 'Coming soon' until the file buyers download is set (deploy/setup.enc or the admin panel)."
            exit 0
          fi
          echo "READY=true" >> "$GITHUB_ENV"
          UTR="0000$(shuf -i 10000000-99999999 -n 1)"
          PAY="$(curl -sf -X POST "$APP_URL/api/payments" -H 'Content-Type: application/json' -d "{\"utr\":\"$UTR\",\"name\":\"Deploy check\"}")"
          curl -sf -o "$RUNNER_TEMP/download" "$APP_URL$(echo "$PAY" | jq -r .downloadUrl)"
          GOT="$(sha256sum "$RUNNER_TEMP/download" | cut -d' ' -f1)"
          WANT="$(node scripts/deploy-setup.js file-sha)"
          rm -f "$RUNNER_TEMP/download"
          [ "$GOT" = "$WANT" ] || { echo "::error::The downloaded file doesn't match the uploaded one."; exit 1; }
          echo "Buyer flow works: UTR accepted and the downloaded file matches ($GOT)."
          ID="$(curl -sf -H "Cookie: admin_session=$COOKIE" "$APP_URL/api/admin/payments" | jq -r --arg u "$UTR" '.payments[] | select(.utr == $u) | .id')"
          curl -sf -X DELETE -H "Cookie: admin_session=$COOKIE" "$APP_URL/api/admin/payments/$ID" >/dev/null
          echo "Test entry $UTR deleted."

      - name: Summary
        run: |
          echo "PAY_AND_DOWNLOAD_URL=$APP_URL"
          {
            echo "### Pay & Download is live"
            echo ""
            echo "| | Address |"
            echo "|---|---|"
            echo "| Payment page | $APP_URL/ |"
            echo "| Admin panel | $APP_URL/admin |"
            echo ""
            if [ "$READY" = true ]; then echo "Buyers can pay and download now."; else echo "Shows *Coming soon* until the file is uploaded."; fi
            echo ""
            echo "The free server sleeps after ~15 minutes without visitors; the next visit takes about a minute to wake it."
          } >> "$GITHUB_STEP_SUMMARY"
